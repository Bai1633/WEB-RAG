services:
  # ==================== PostgreSQL + pgvector ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: web_rag_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-web_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: do not expose the database to the host. Only nginx publishes
    # ports. Uncomment temporarily if you need a local DB client, then revert.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: web_rag_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # SECURITY: same as above — keep Redis off the host network.
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Backend API ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: web_rag_backend
    environment:
      - ENVIRONMENT=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-web_rag}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-3.5-turbo}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-text-embedding-ada-002}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # MUST match your embedding model: ada-002=1536, qwen3.7-text-embedding=1024
      # If unset it falls back to config.py default (1536) and vector columns
      # will mismatch the real model dimension -> indexing/retrieval breaks.
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      # Reranker weights are NOT copied into the image (see Dockerfile), so
      # default to false to avoid a pointless 3GB torch dependency at runtime.
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - TRUST_PROXY_HEADERS=true  # nginx is the trusted proxy in this stack
      - LOG_LEVEL=info
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting server...' &&
        gunicorn app.main:app 
          --worker-class uvicorn.workers.UvicornWorker
          --workers 4
          --bind 0.0.0.0:8000
          --timeout 120
          --keep-alive 5
          --log-level info
      "

  # ==================== Celery Worker ====================
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: web_rag_worker
    environment:
      - ENVIRONMENT=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-web_rag}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-3.5-turbo}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-text-embedding-ada-002}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # Must be identical to the backend value, otherwise chunks are written
      # with a different dimension than the vector table expects.
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - LOG_LEVEL=info
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Starting Celery worker...' &&
        celery -A app.workers.celery_app.celery_app worker 
          --loglevel=info
          --concurrency=4
          -Q celery
          --max-tasks-per-child=100
      "

  # ==================== Frontend ====================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: web_rag_frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: web_rag_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # Proxy to the real backend health endpoint. The previous `/health` was
      # served by nginx itself (return 200), so a dead backend still looked green.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  upload_data:
