[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-rag-backend"
version = "1.0.0"
description = "Production-grade RAG knowledge base Q&A system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    # Task Queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    # RAG
    "llama-index>=0.12.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-llms-openai>=0.2.0",
    "llama-index-llms-ollama>=0.2.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-postprocessor-bge-rerank>=0.2.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    # Config & Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # Document Parsing
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.2",
    "markdown>=3.5.1",
    "chardet>=5.2.0",
    "aiofiles>=23.2.1",
    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    # Security
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ragas>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "N818"]  # N818: AppException is the API-facing project name

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
